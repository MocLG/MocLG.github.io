name: Sync pinned projects

# No push trigger on purpose: this workflow commits to the same branch GitHub
# Pages serves, so a push trigger would retrigger itself in an infinite loop.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-projects
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Regenerate PROJECTS from the GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/sync-projects.mjs

      - name: Commit if index.html changed
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html is already up to date; nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: sync pinned projects from GitHub API"
          git push
